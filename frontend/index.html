<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />

  <!--
      LANGUAGE BOOT — must stay the first script in the document.
      Sets the correct lang/dir before the bundle loads to prevent CLS.
    -->
  <script>
    ; (function () {
      try {
        var saved = localStorage.getItem('invite-studio.lang')
        if (saved !== 'ar' && saved !== 'en') return
        var html = document.documentElement
        html.lang = saved
        html.dir = saved === 'ar' ? 'rtl' : 'ltr'
      } catch (e) { }
    })()
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5DCD8" />

  <title>Invite Studio by Ali | دعوات رقمية تفاعلية فاخرة</title>
  <meta name="description"
    content="صمّمي دعوتك الرقمية التفاعلية بأسلوب فاخر ومخصص، مع الموسيقى، تأكيد الحضور، تفاصيل المناسبة، الخرائط والمزيد." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Invite Studio by Sarah" />
  <meta property="og:title" content="Invite Studio by Sarah | دعوات رقمية تفاعلية فاخرة" />
  <meta property="og:description"
    content="صمّمي دعوتك الرقمية التفاعلية بأسلوب فاخر ومخصص، مع الموسيقى، تأكيد الحضور، تفاصيل المناسبة، الخرائط والمزيد." />
  <meta property="og:image" content="/brand/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fonts — same as reference -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Pinyon+Script&display=swap"
    rel="stylesheet" />
</head>
